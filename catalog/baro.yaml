name: baro
repo: https://github.com/jigjoy-ai/hermes-baro
# PLACEHOLDER — fill with real commit sha at submission
sha: "0000000000000000000000000000000000000000"
subdir: ""
description: "Hand a software goal to Baro and watch it run as a live, dependency-aware kanban: baro_plan returns the plan as stories with dependency edges, baro_run starts a run, baro_status shows each story as blocked, ready, running, done or failed with what it waits on and what it blocks, and baro_cancel stops the run and its process tree. Disclosure — every baro_run and baro_plan call is sent to Hermes's human-approval gate by the plugin's pre_tool_call hook, whatever the approval mode, because once approved Baro's coding agents execute shell commands in the target repository without further prompts (each in its own git worktree, with shell commands and file writes that leave it refused, and no push or pull request; these guards are not an OS sandbox, and agents run with the user's account); baro_run starts one long-running background process per run (baro-ai@0.121.0 through npx, pinned exactly) via Hermes's terminal tool; Baro's agents make network calls to the model provider the user configured for Baro; boards are stored only in the plugin's own Hermes plugin state; the plugin reads no credentials and no files outside that state, has no telemetry, and refuses to start or stop runs under cron and the messaging gateway."
