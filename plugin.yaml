# Hermes plugin manifest (ADR-011). Key names follow
# reference-hermes-agent/website/docs/developer-guide/plugins/index.md:357-368
# (name, version, description, provides_tools) and :624 (license).
# requires_hermes is checked by hermes_cli/plugin_validate.py:115-128.
#
# provides_tools must list exactly what register() registers: the four tools of
# toolset "baro" (bridge.py). See index.md:370-372 and the "declared tools" check
# at hermes_cli/plugin_validate.py:436-458.
# The Desktop surface needs no manifest key: Hermes loads desktop/plugin.js from
# its path (index.md:700-703), and plugin_validate_desktop.py lints that file.
# provides_hooks lists the one hook register() adds: pre_tool_call, which sends
# every baro_run and baro_plan call to Hermes's human-approval gate (core/consent.py).
# There are no commands or privileged host capabilities (index.md:384-412).
name: baro
version: 0.1.0
description: >-
  Hand a software goal to Baro and watch it run as a live, dependency-aware
  kanban. Provides baro_plan, baro_run, baro_status and baro_cancel, plus a
  Desktop panel.
author: JigJoy
license: MIT
requires_hermes: ">=0.22.7"
provides_tools:
  - baro_plan
  - baro_run
  - baro_status
  - baro_cancel
provides_hooks:
  - pre_tool_call
# Settings form under Settings → Plugins → Baro (index.md "Settings form in the
# Desktop"); read through ctx.get_config in bridge.py. Off by default: the
# plugin then picks no backend, URL or model (core/settings.py).
config_schema:
  hermes_subscription:
    type: bool
    default: false
    label: "Use my Hermes subscription"
    description: "Run Baro's agents on your Hermes subscription through the local proxy (start it with `hermes proxy start`). A backend named in the request still wins."
  hermes_subscription_model:
    type: str
    default: "nous/welcome"
    label: "Subscription model"
    description: "Model Baro uses on the subscription; one your tier serves (the proxy's /v1/models lists them)."
  hermes_proxy_url:
    type: str
    default: "http://127.0.0.1:8645/v1"
    label: "Proxy URL"
    description: "Where `hermes proxy start` listens."
